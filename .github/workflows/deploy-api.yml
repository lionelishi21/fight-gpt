name: Deploy API to EC2

on:
  push:
    branches: [main]
    paths:
      - 'fight-gpt-node-backend/**'

  # Manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          port:     22
          timeout:  300s
          script: |
            # Find the backend directory (handles any repo clone location)
            APP_DIR=$(find /home -name "package.json" -path "*/fight-gpt-node-backend/package.json" 2>/dev/null | head -n 1 | xargs dirname)
            echo "→ Backend dir: $APP_DIR"
            if [ -z "$APP_DIR" ]; then
              echo "❌ Could not locate fight-gpt-node-backend"
              exit 1
            fi
            cd "$APP_DIR"

            # 0. Inject secrets into .env (idempotent — safe to re-run)
            echo "→ Updating .env secrets..."
            sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}|" .env || true
            sed -i "s|^JWT_SECRET=.*|JWT_SECRET=${{ secrets.JWT_SECRET }}|" .env || true
            sed -i "s|^INTERNAL_WEBHOOK_SECRET=.*|INTERNAL_WEBHOOK_SECRET=${{ secrets.INTERNAL_WEBHOOK_SECRET }}|" .env || true
            sed -i "s|^MASTER_ADMIN_EMAIL=.*|MASTER_ADMIN_EMAIL=${{ secrets.MASTER_ADMIN_EMAIL }}|" .env || true
            sed -i "s|^DEFAULT_ADMIN_PASSWORD=.*|DEFAULT_ADMIN_PASSWORD=${{ secrets.DEFAULT_ADMIN_PASSWORD }}|" .env || true
            sed -i "s|^STRIPE_SECRET_KEY=.*|STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}|" .env || true
            sed -i "s|^STRIPE_WEBHOOK_SECRET=.*|STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}|" .env || true
            sed -i "s|^GOOGLE_CLOUD_PROJECT=.*|GOOGLE_CLOUD_PROJECT=${{ secrets.GOOGLE_CLOUD_PROJECT }}|" .env || true
            sed -i "s|^GOOGLE_STORAGE_BUCKET=.*|GOOGLE_STORAGE_BUCKET=${{ secrets.GOOGLE_STORAGE_BUCKET }}|" .env || true
            grep -q "^GEMINI_API_KEY=" .env || echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
            grep -q "^JWT_SECRET=" .env || echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            grep -q "^INTERNAL_WEBHOOK_SECRET=" .env || echo "INTERNAL_WEBHOOK_SECRET=${{ secrets.INTERNAL_WEBHOOK_SECRET }}" >> .env
            grep -q "^MASTER_ADMIN_EMAIL=" .env || echo "MASTER_ADMIN_EMAIL=${{ secrets.MASTER_ADMIN_EMAIL }}" >> .env
            grep -q "^DEFAULT_ADMIN_PASSWORD=" .env || echo "DEFAULT_ADMIN_PASSWORD=${{ secrets.DEFAULT_ADMIN_PASSWORD }}" >> .env
            grep -q "^STRIPE_SECRET_KEY=" .env || echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env
            grep -q "^STRIPE_WEBHOOK_SECRET=" .env || echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" >> .env
            grep -q "^GOOGLE_CLOUD_PROJECT=" .env || echo "GOOGLE_CLOUD_PROJECT=${{ secrets.GOOGLE_CLOUD_PROJECT }}" >> .env
            grep -q "^GOOGLE_STORAGE_BUCKET=" .env || echo "GOOGLE_STORAGE_BUCKET=${{ secrets.GOOGLE_STORAGE_BUCKET }}" >> .env
            sed -i "s|^RESEND_API_KEY=.*|RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}|" .env || true
            sed -i "s|^FROM_EMAIL=.*|FROM_EMAIL=${{ secrets.FROM_EMAIL }}|" .env || true
            sed -i "s|^GEMINI_MODEL=.*|GEMINI_MODEL=${{ secrets.GEMINI_MODEL }}|" .env || true
            sed -i "s|^GEMINI_MODEL_PREMIUM=.*|GEMINI_MODEL_PREMIUM=${{ secrets.GEMINI_MODEL_PREMIUM }}|" .env || true
            grep -q "^RESEND_API_KEY=" .env || echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env
            grep -q "^FROM_EMAIL=" .env || echo "FROM_EMAIL=${{ secrets.FROM_EMAIL }}" >> .env
            grep -q "^GEMINI_MODEL=" .env || echo "GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}" >> .env
            grep -q "^GEMINI_MODEL_PREMIUM=" .env || echo "GEMINI_MODEL_PREMIUM=${GEMINI_MODEL_PREMIUM:-gemini-2.5-pro}" >> .env
            sed -i "s|^YOUTUBE_API_KEY=.*|YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}|" .env || true
            grep -q "^YOUTUBE_API_KEY=" .env || echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" >> .env
            sed -i "s|^START_GG_TOKEN=.*|START_GG_TOKEN=${{ secrets.START_GG_TOKEN }}|" .env || true
            grep -q "^START_GG_TOKEN=" .env || echo "START_GG_TOKEN=${{ secrets.START_GG_TOKEN }}" >> .env
            sed -i "s|^DISCORD_BOT_TOKEN=.*|DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }}|" .env || true
            grep -q "^DISCORD_BOT_TOKEN=" .env || echo "DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }}" >> .env
            sed -i "s|^SENTRY_DSN=.*|SENTRY_DSN=${{ secrets.SENTRY_DSN }}|" .env || true
            grep -q "^SENTRY_DSN=" .env || echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env
            sed -i "s|^GROK_API_KEY=.*|GROK_API_KEY=${{ secrets.GROK_API_KEY }}|" .env || true
            grep -q "^GROK_API_KEY=" .env || echo "GROK_API_KEY=${{ secrets.GROK_API_KEY }}" >> .env

            # 1. Pull latest code — hard reset to origin/main to handle local modifications
            echo "→ Fetching latest from main..."
            git fetch origin
            git reset --hard origin/main
            echo "→ Now on commit: $(git log -1 --oneline)"

            # 3. Install all deps (including devDeps needed for build)
            echo "→ Installing dependencies..."
            npm ci

            # 4. Build TypeScript — dist/ is gitignored, must be compiled on server
            echo "→ Compiling TypeScript..."
            npm run build
            echo "→ dist/index.js: $(ls -lh dist/index.js)"
            echo "→ dist/services: $(ls dist/services/*.js 2>/dev/null | wc -l) files"

            # 5. Prune devDeps after build to keep memory footprint small
            echo "→ Pruning dev dependencies..."
            npm prune --omit=dev

            # 6. Zero-downtime reload — pm2 reload keeps existing connections alive
            # Use startOrRestart only if processes don't exist yet, then reload on subsequent deploys
            echo "→ Reloading PM2 apps (zero-downtime)..."
            pm2 startOrRestart ecosystem.config.js --env production --update-env || pm2 reload all
            pm2 save

            # 7. Seed games and pro players (ensure registry is synced)
            echo "→ Seeding database registries..."
            npx tsx src/scripts/seedGames.ts || true
            npx tsx src/scripts/seedProPlayers.ts || true

            # 9. Purge bad analyses (data integrity cleanup)
            echo "→ Cleaning up hallucinated and duplicate analyses..."
            npx tsx scripts/purge_bad_analyses.ts || true

            # 8. Diagnostics and health check
            echo "→ PORT in .env: $(grep '^PORT=' .env 2>/dev/null || echo 'not set')"
            sleep 10
            echo "→ All listening ports:"
            ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null || true
            echo "→ PM2 full list:"
            pm2 list 2>/dev/null || true
            echo "→ API logs (last 20 lines):"
            timeout 5 pm2 logs fightgpt-api --lines 20 --nostream 2>/dev/null || true
            echo "→ Worker logs (last 20 lines):"
            timeout 5 pm2 logs fightgpt-worker --lines 20 --nostream 2>/dev/null || true
            echo "→ Health check on 3000..."
            curl -sf http://localhost:3000/api/health && echo "✅ UP on 3000" || echo "❌ 3000 failed"
            echo "→ Health check on 3010..."
            curl -sf http://localhost:3010/api/health && echo "✅ UP on 3010" || echo "❌ 3010 failed"

            # Worker status check — fail deploy if worker is not online
            echo "→ Checking worker status..."
            WORKER_STATUS=$(pm2 jlist 2>/dev/null | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); const p=JSON.parse(d).find(x=>x.name==='fightgpt-worker'); console.log(p?.pm2_env?.status||'missing')" 2>/dev/null || echo "unknown")
            if [ "$WORKER_STATUS" = "online" ]; then
              echo "✅ Worker is online"
            else
              echo "❌ Worker status: $WORKER_STATUS — attempting manual start..."
              pm2 start ecosystem.config.js --only fightgpt-worker --env production --update-env
              pm2 save
            fi

            # 10. Re-queue any pending ingestion jobs so the freshly-started worker picks them up
            echo "→ Re-queuing pending ingestion jobs..."
            PORT_NUM=$(grep '^PORT=' .env 2>/dev/null | cut -d= -f2 || echo "3000")
            curl -sf -X POST "http://localhost:${PORT_NUM}/api/admin/ingestion/bulk-queue" \
              -H "x-admin-secret: $(grep '^ADMIN_API_SECRET=' .env | cut -d= -f2)" \
              && echo "✅ Pending jobs queued" || echo "⚠️  bulk-queue skipped (no pending jobs or endpoint unavailable)"

            echo "✅ Deploy complete"

      - name: Notify success
        if: success()
        run: echo "✅ FightGPT API deployed successfully"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deploy failed — check EC2 logs"
