name: Deploy API to EC2

on:
  push:
    branches: [main]
    paths:
      - 'fight-gpt-node-backend/**'

  # Manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          port:     22
          timeout:  300s
          script: |
            cd /home/ubuntu/fight-gpt/fight-gpt-node-backend
            bash deploy.sh

      - name: Notify success
        if: success()
        run: echo "✅ FightGPT API deployed successfully"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deploy failed — check EC2 logs"
