name: Deploy API to EC2

on:
  push:
    branches: [main]
    paths:
      - 'fight-gpt-node-backend/**'

  # Manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          port:     22
          timeout:  300s
          script: |
            # Find the backend directory (handles any repo clone location)
            APP_DIR=$(find /home -name "package.json" -path "*/fight-gpt-node-backend/package.json" 2>/dev/null | head -n 1 | xargs dirname)
            echo "→ Backend dir: $APP_DIR"
            if [ -z "$APP_DIR" ]; then
              echo "❌ Could not locate fight-gpt-node-backend"
              exit 1
            fi
            cd "$APP_DIR"

            # 0. Inject secrets into .env (idempotent — safe to re-run)
            echo "→ Updating .env secrets..."
            sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}|" .env || true
            sed -i "s|^JWT_SECRET=.*|JWT_SECRET=${{ secrets.JWT_SECRET }}|" .env || true
            sed -i "s|^INTERNAL_WEBHOOK_SECRET=.*|INTERNAL_WEBHOOK_SECRET=${{ secrets.INTERNAL_WEBHOOK_SECRET }}|" .env || true
            sed -i "s|^MASTER_ADMIN_EMAIL=.*|MASTER_ADMIN_EMAIL=${{ secrets.MASTER_ADMIN_EMAIL }}|" .env || true
            sed -i "s|^DEFAULT_ADMIN_PASSWORD=.*|DEFAULT_ADMIN_PASSWORD=${{ secrets.DEFAULT_ADMIN_PASSWORD }}|" .env || true
            grep -q "^GEMINI_API_KEY=" .env || echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
            grep -q "^JWT_SECRET=" .env || echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            grep -q "^INTERNAL_WEBHOOK_SECRET=" .env || echo "INTERNAL_WEBHOOK_SECRET=${{ secrets.INTERNAL_WEBHOOK_SECRET }}" >> .env
            grep -q "^MASTER_ADMIN_EMAIL=" .env || echo "MASTER_ADMIN_EMAIL=${{ secrets.MASTER_ADMIN_EMAIL }}" >> .env
            grep -q "^DEFAULT_ADMIN_PASSWORD=" .env || echo "DEFAULT_ADMIN_PASSWORD=${{ secrets.DEFAULT_ADMIN_PASSWORD }}" >> .env

            # 1. Ensure yt-dlp is installed (required for ingestion pipeline)
            echo "→ Checking yt-dlp..."
            if ! command -v yt-dlp &>/dev/null; then
              echo "→ Installing yt-dlp..."
              curl -sSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
              chmod a+rx /usr/local/bin/yt-dlp
              echo "✅ yt-dlp installed: $(yt-dlp --version)"
            else
              echo "✅ yt-dlp already installed: $(yt-dlp --version)"
              yt-dlp -U || true
            fi

            # 2. Pull latest code — hard reset to origin/main to handle local modifications
            echo "→ Fetching latest from main..."
            git fetch origin
            git reset --hard origin/main
            echo "→ Now on commit: $(git log -1 --oneline)"

            # 3. Install production deps + build tools
            echo "→ Installing dependencies..."
            npm ci --omit=dev
            npm install --save-dev tsx typescript

            # 4. Type check
            echo "→ Type checking..."
            npx tsc --noEmit || true

            # 5. Build
            echo "→ Building TypeScript from: $(pwd)"
            echo "→ index.ts version check: $(grep 'BUILD_2026' src/index.ts || echo 'NOT FOUND in src')"
            rm -rf dist
            npm run build
            echo "→ dist/index.js exists: $(ls -la dist/index.js 2>/dev/null || echo 'NOT FOUND')"
            echo "→ dist index version: $(grep 'BUILD_2026' dist/index.js 2>/dev/null || echo 'NOT FOUND in dist')"

            # 6. Restart PM2
            echo "→ Restarting PM2..."
            pm2 delete fightgpt-api || true
            pm2 list
            pm2 start ecosystem.config.js --env production
            pm2 list
            pm2 save

            # 7. Health check
            echo "→ Health check..."
            sleep 5
            curl -sf http://localhost:3010/api/ || curl -sf http://localhost:3000/api/ || echo "⚠️  Health check inconclusive — check PM2 logs"
            echo "✅ Deploy complete"

      - name: Notify success
        if: success()
        run: echo "✅ FightGPT API deployed successfully"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deploy failed — check EC2 logs"
