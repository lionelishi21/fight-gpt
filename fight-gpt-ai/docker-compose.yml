version: '3.8'

services:
  fight-gpt-api:
    build: .
    container_name: fight-gpt-coach
    ports:
      - "8000:8000"
    volumes:
      # Mount the videos directory to persist downloaded videos
      - ./videos:/app/videos
      # Mount uploads folder for local video files
      - ./uploads:/app/uploads
      # Mount the analysis JSON files
      - ./:/app
      # Mount cookies file for YouTube authentication (optional)
      - ./cookies.txt:/app/cookies.txt:ro
    environment:
      # MongoDB connection string (already in your code)
      - MONGO_URI=mongodb+srv://lionelishmael_db_user:uRBhj6kDHWm2c21j@cluster0.rjgiyva.mongodb.net/fightgpt_database
      # Optional: Grok API key for semantic video analysis
      # Get your API key from https://x.ai/
      # - GROK_API_KEY=your-grok-api-key-here
      # Optional: Custom Grok API URL (defaults to https://api.x.ai/v1/chat/completions)
      # - GROK_API_URL=https://api.x.ai/v1/chat/completions
      # Required: Google API key for Gemini video analysis
      # Get your API key from https://makersuite.google.com/app/apikey
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-${GEMINI_API_KEY:-AIzaSyDjzlUT8x4yWaYt9Q0nyZa0rxwjCHIj7HE}}
      # Optional: Gemini model selection (default: gemini-1.5-flash)
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      # Optional: YouTube cookies file path for bypassing bot detection
      # Export cookies from your browser and save as cookies.txt in project root
      - YOUTUBE_COOKIES_FILE=/app/cookies.txt
    restart: unless-stopped
    # Add a health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api-gateway:
    build:
      context: ./api-gateway
    container_name: fight-gpt-api-gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AI_SERVICE_URL=http://fight-gpt-api:8000
      - MONGO_URI=mongodb+srv://lionelishmael_db_user:uRBhj6kDHWm2c21j@cluster0.rjgiyva.mongodb.net/fightgpt_database
      - MONGO_DB_NAME=fight_gpt_db
      - MONGO_CACHE_COLLECTION=analysis_cache
      - MONGO_AUDIT_COLLECTION=analysis_requests
      - AI_REQUEST_TIMEOUT_MS=300000
    depends_on:
      fight-gpt-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s




