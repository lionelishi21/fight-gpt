# /etc/nginx/sites-available/fightgpt-api
# Symlink: ln -s /etc/nginx/sites-available/fightgpt-api /etc/nginx/sites-enabled/

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name api.fightingames.online;
    return 301 https://$host$request_uri;
}

# HTTPS — API
server {
    listen 443 ssl http2;
    server_name api.fightingames.online;

    # SSL — managed by Certbot (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/api.fightingames.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fightingames.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options          "DENY"            always;
    add_header X-XSS-Protection         "1; mode=block"   always;
    add_header X-Content-Type-Options   "nosniff"         always;
    add_header Referrer-Policy          "no-referrer"     always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Upload limit (video analysis requests)
    client_max_body_size 200M;

    # Timeouts — long-running video analysis can take minutes
    proxy_read_timeout    600s;
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass                 $http_upgrade;
    }

    # Health check endpoint — no logging
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }
}
